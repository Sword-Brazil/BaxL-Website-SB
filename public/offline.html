<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1720" />
    <title>Sem conexão · Sword Brasil</title>
    <link rel="icon" href="/brand/favicon.png" />
    <style>
      /* Mesmas cores do tema escuro do site (globals.css). */
      :root {
        color-scheme: dark;
        --background: oklch(0.16 0.02 240);
        --foreground: oklch(0.94 0.012 215);
        --muted-foreground: oklch(0.72 0.025 220);
        --primary: oklch(0.8 0.13 205);
        --primary-foreground: oklch(0.17 0.03 240);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; display: grid; gap: 12px; justify-items: center; }
      img { width: 96px; height: 96px; border-radius: 20px; }
      h1 { margin: 8px 0 0; font-size: 1.375rem; }
      p { margin: 0; color: var(--muted-foreground); line-height: 1.5; }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>Confira a internet do aparelho e tente de novo.</p>
      <p lang="en">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
